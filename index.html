<script>
    // 1. MASUKKAN URL WEB APP GOOGLE SCRIPT TERBARU DI SINI
    const scriptURL = 'MASUKKAN_URL_BARU_SETELAH_DEPLOY_ULANG';

    // 2. Variabel kunci (WAJIB di luar fungsi)
    let isScanning = false; 

    function onScanSuccess(decodedText) {
        // Jika sedang memproses scan, jangan terima scan baru (mencegah berantai)
        if (isScanning) return; 
        
        isScanning = true; // Kunci diaktifkan
        document.getElementById('status').innerHTML = "Sedang mengirim data: " + decodedText;
        
        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({ id: decodedText })
        })
        .then(() => {
            document.getElementById('status').innerHTML = `<span class="success">BERHASIL ABSEN: ${decodedText}</span>`;
            
            // JEDA 3 DETIK: Memberikan waktu untuk menjauhkan barcode dari kamera
            setTimeout(() => { 
                isScanning = false; // Buka kunci kembali
                document.getElementById('status').innerHTML = "Siap memindai..."; 
            }, 3000); 
        })
        .catch(error => {
            alert("Error: " + error);
            isScanning = false; // Jika error, buka kunci agar bisa coba lagi
            document.getElementById('status').innerHTML = "Gagal mengirim data.";
        });
    }

    function onScanFailure(error) {
        // Abaikan error saat kamera tidak menemukan barcode dalam frame
    }

    let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(onScanSuccess, onScanFailure);
</script>
