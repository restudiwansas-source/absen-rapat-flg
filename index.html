<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Absensi FLG</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f4; margin: 0; padding: 20px; }
        #reader { width: 100%; max-width: 500px; margin: auto; background: white; border-radius: 10px; overflow: hidden; border: 2px solid #ddd; }
        #status { margin-top: 20px; padding: 15px; border-radius: 5px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); font-weight: bold; }
        .success { color: #2ecc71; }
    </style>
</head>
<body>

    <h2>Scanner Absensi Rapat</h2>
    <div id="reader"></div>
    <div id="status">Menunggu Kamera...</div>

    <script>
        // 1. PASTIKAN URL INI BENAR (URL DARI GOOGLE APPS SCRIPT)
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwLV6YjT96WS66kM_FsBSNOa_LVZRVlfzETtleRA556uPyXjFbFbyK8AnRuB1vsrEwzfg/exec';

        let isScanning = false;

        function onScanSuccess(decodedText) {
            if (isScanning) return;
            isScanning = true;

            // Suara bip sederhana (opsional, beberapa HP mungkin blokir auto-audio)
            console.log("Terdeteksi ID: " + decodedText);
            document.getElementById('status').innerHTML = "Sedang Memproses: " + decodedText;

            // Kirim data ke Google Sheets
            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ id: decodedText })
            })
            .then(() => {
                document.getElementById('status').innerHTML = `<span class="success">BERHASIL ABSEN: ${decodedText}</span>`;
                
                // Matikan scanner agar tidak scan berantai
                html5QrcodeScanner.clear();

                // Refresh halaman setelah 3 detik untuk scan orang berikutnya
                setTimeout(() => {
                    location.reload();
                }, 3000);
            })
            .catch(error => {
                console.error('Error:', error);
                alert("Gagal kirim data. Cek koneksi internet.");
                isScanning = false;
            });
        }

        function onScanFailure(error) {
            // Biarkan kosong agar tidak blank jika gagal fokus
        }

        // Jalankan Scanner
        let html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
            fps: 10, 
            qrbox: {width: 250, height: 250} 
        });
        
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>
</body>
</html>
